name: Task
description: A concrete, actionable work item.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for concrete, actionable work items.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this task is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any extra context, links, dependencies, or references.
  - type: dropdown
    id: auto-flow
    attributes:
      label: Auto-Flow
      description: Should this task be automatically dispatched to an agent?
      options:
        - "Yes — auto-assign to Copilot"
        - "No — manual assignment"
      default: 0
