name: Issue Dispatch

on:
  issues:
    types: [opened, labeled]

jobs:
  dispatch:
    name: Auto-Assign Agent
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Triage issue
        id: triage
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;

            // Skip if already assigned
            if (issue.assignees && issue.assignees.length > 0) {
              core.info(`Issue #${issueNumber} already assigned, skipping.`);
              return;
            }

            // Skip if opt-out label is present
            const hasOptOut = issue.labels.some(l => l.name === 'no-auto-dispatch');
            if (hasOptOut) {
              core.info(`Issue #${issueNumber} has no-auto-dispatch label, skipping.`);
              return;
            }

            // Query issue type via GraphQL
            const { repository } = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    issueType { name }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: issueNumber,
            });

            const issueType = repository.issue.issueType?.name;
            core.info(`Issue #${issueNumber} type: ${issueType || 'none'}`);

            // Only dispatch Task and Bug issues — skip Epics and Features (planning items)
            const dispatchableTypes = ['Task', 'Bug'];
            if (!issueType || !dispatchableTypes.includes(issueType)) {
              core.info(`Issue #${issueNumber} is type "${issueType}" — not dispatchable, skipping.`);
              return;
            }

            // For labeled events, only proceed if the label is 'auto-flow'
            if (context.payload.action === 'labeled') {
              const labelName = context.payload.label?.name;
              if (labelName !== 'auto-flow') {
                core.info(`Label "${labelName}" is not auto-flow, skipping.`);
                return;
              }
            }

            // Signal that this issue should be dispatched
            core.setOutput('should_dispatch', 'true');
            core.setOutput('issue_node_id', issue.node_id);
            core.info(`Issue #${issueNumber} is eligible for auto-dispatch.`);

      # Assign Copilot coding agent using a PAT.
      # The Copilot assignment API requires a user token — GITHUB_TOKEN (installation token) cannot
      # assign Copilot. See: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/create-a-pr#assigning-an-issue-to-copilot-via-the-github-api
      - name: Assign Copilot
        if: steps.triage.outputs.should_dispatch == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_DISPATCH_PAT }}
          script: |
            const issueNumber = context.payload.issue.number;
            const issueNodeId = '${{ steps.triage.outputs.issue_node_id }}';
            const COPILOT_BOT_NODE_ID = 'BOT_kgDOC9w8XQ';
            const REPOSITORY_NODE_ID = '${{ github.event.repository.node_id }}';
            const GRAPHQL_FEATURES = 'issues_copilot_assignment_api_support,coding_agent_model_selection';

            try {
              await github.graphql(`
                mutation($issueId: ID!, $assigneeIds: [ID!]!, $repoId: ID!) {
                  addAssigneesToAssignable(input: {
                    assignableId: $issueId
                    assigneeIds: $assigneeIds
                    agentAssignment: {
                      targetRepositoryId: $repoId
                      baseRef: "main"
                    }
                  }) {
                    assignable {
                      ... on Issue {
                        number
                        assignees(first: 5) { nodes { login } }
                      }
                    }
                  }
                }
              `, {
                issueId: issueNodeId,
                assigneeIds: [COPILOT_BOT_NODE_ID],
                repoId: REPOSITORY_NODE_ID,
                headers: {
                  'GraphQL-Features': GRAPHQL_FEATURES,
                },
              });
              core.info(`Assigned Copilot to issue #${issueNumber}`);
            } catch (e) {
              core.setFailed(`Failed to assign Copilot to issue #${issueNumber}: ${e.message}`);
            }

      # Add label using GITHUB_TOKEN (doesn't need user token)
      - name: Add agent/assigned label
        if: steps.triage.outputs.should_dispatch == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['agent/assigned'],
              });
              core.info(`Added agent/assigned label to issue #${issueNumber}`);
            } catch (e) {
              // Label may not exist yet — create it first
              if (e.status === 404 || e.message.includes('Label does not exist')) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: 'agent/assigned',
                    color: '0e8a16',
                    description: 'Issue has been auto-dispatched to an agent',
                  });
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    labels: ['agent/assigned'],
                  });
                  core.info(`Created and added agent/assigned label to issue #${issueNumber}`);
                } catch (e2) {
                  core.warning(`Failed to create/add label: ${e2.message}`);
                }
              } else {
                core.warning(`Failed to add label: ${e.message}`);
              }
            }
