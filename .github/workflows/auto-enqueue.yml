name: Auto Enqueue

on:
  workflow_run:
    workflows: ["Validate Plugin", "Require Linked Issue"]
    types: [completed]
  # Sweep all open PRs periodically — catches PRs that missed event-driven enqueue
  # (e.g., triage resolved threads after checks passed, race conditions, late approvals)
  schedule:
    - cron: '*/15 * * * *'
  # Allow manual trigger for testing / unblocking stuck PRs
  workflow_dispatch:

jobs:
  auto-enqueue:
    name: Auto Enqueue
    # For workflow_run: only proceed on success. For schedule/dispatch: always run.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Enqueue ready PRs
        uses: actions/github-script@v7
        with:
          script: |
            const requiredChecks = ['Static Validation', 'Check Linked Issue'];

            // Helper: get the latest check run conclusion for a given name
            function latestConclusion(checkRuns, name) {
              const matches = checkRuns
                .filter(r => r.name === name && r.status === 'completed')
                .sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));
              return matches.length > 0 ? matches[0].conclusion : null;
            }

            // For workflow_run events, we know the head SHA. For schedule, sweep all.
            const targetSha = context.payload.workflow_run?.head_sha || null;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            let enqueued = 0;
            let dispatched = 0;
            for (const pr of prs) {
              // For workflow_run events, only process the PR that triggered it
              if (targetSha && pr.head.sha !== targetSha) continue;

              // Copilot PRs (draft or non-draft): dispatch copilot-checks.yml to validate and activate.
              // GITHUB_TOKEN can trigger workflow_dispatch (Sept 2022 exception).
              // Non-draft Copilot PRs still need dispatch because synchronize events from
              // Copilot conflict-resolution pushes get action_required.
              if (pr.head.ref.startsWith('copilot/')
                  && ['Copilot', 'copilot-swe-agent[bot]'].includes(pr.user.login)) {
                // Verify the PR has a linked issue before dispatching
                const linked = await github.graphql(`
                  query($owner:String!,$repo:String!,$pr:Int!) {
                    repository(owner:$owner,name:$repo) {
                      pullRequest(number:$pr) {
                        closingIssuesReferences(first:1) { totalCount }
                      }
                    }
                  }
                `, { owner: context.repo.owner, repo: context.repo.repo, pr: pr.number });

                if (linked.repository.pullRequest.closingIssuesReferences.totalCount === 0) {
                  core.info(`PR #${pr.number}: Copilot PR with no linked issue, skipping.`);
                  continue;
                }

                // Skip if already enqueued in merge queue
                if (pr.auto_merge) {
                  // Check if required checks already pass on HEAD
                  const { data: checkData } = await github.rest.checks.listForRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: pr.head.sha,
                    per_page: 100,
                  });
                  const allPassed = requiredChecks.every(name =>
                    latestConclusion(checkData.check_runs, name) === 'success'
                  );
                  if (allPassed) {
                    core.info(`PR #${pr.number}: Copilot PR already has passing checks, skipping dispatch.`);
                    continue;
                  }
                }

                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'copilot-checks.yml',
                    ref: 'main',
                    inputs: { pr_number: String(pr.number) },
                  });
                  dispatched++;
                  core.info(`PR #${pr.number}: dispatched copilot-checks.yml for Copilot PR.`);
                } catch (e) {
                  core.info(`PR #${pr.number}: dispatch failed: ${e.message}`);
                }
                continue;
              }

              if (pr.draft) {
                core.info(`PR #${pr.number}: is a draft, skipping.`);
                continue;
              }
              if (!pr.auto_merge) {
                core.info(`PR #${pr.number}: auto-merge not enabled, skipping.`);
                continue;
              }

              // Skip PRs in active triage (threads still being resolved)
              const triageActive = pr.labels?.some(l => l.name === 'triage/active');
              if (triageActive) {
                core.info(`PR #${pr.number}: triage/active label present, skipping.`);
                continue;
              }

              // Verify latest run of each required check passed
              const { data: checkData } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const allPassed = requiredChecks.every(name =>
                latestConclusion(checkData.check_runs, name) === 'success'
              );
              if (!allPassed) {
                core.info(`PR #${pr.number}: not all required checks passed yet.`);
                continue;
              }

              // Verify approval
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              if (!reviews.some(r => r.state === 'APPROVED')) {
                core.info(`PR #${pr.number}: no approval yet.`);
                continue;
              }

              // Auto-resolve bot review threads before checking for unresolved conversations.
              // Automated review bots leave informational comments that block the merge queue.
              // GraphQL author.login omits the [bot] suffix shown in the UI.
              // Keep both forms so the match works regardless of API surface.
              const botLogins = new Set([
                'github-code-quality[bot]',  'github-code-quality',
                'devin-ai-integration[bot]', 'devin-ai-integration',
                'github-advanced-security[bot]', 'github-advanced-security',
              ]);

              const threadData = await github.graphql(`
                query($owner:String!,$repo:String!,$pr:Int!) {
                  repository(owner:$owner,name:$repo) {
                    pullRequest(number:$pr) {
                      reviewThreads(first:100) {
                        nodes {
                          id
                          isResolved
                          comments(first:1) {
                            nodes { author { login } }
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner: context.repo.owner, repo: context.repo.repo, pr: pr.number });

              const unresolvedBotThreads = threadData.repository.pullRequest.reviewThreads.nodes
                .filter(t => !t.isResolved && t.comments.nodes.length > 0
                  && botLogins.has(t.comments.nodes[0].author.login));

              for (const thread of unresolvedBotThreads) {
                try {
                  await github.graphql(`
                    mutation($id: ID!) {
                      resolveReviewThread(input: { threadId: $id }) {
                        thread { isResolved }
                      }
                    }
                  `, { id: thread.id });
                  core.info(`PR #${pr.number}: resolved bot thread (by ${thread.comments.nodes[0].author.login})`);
                } catch (e) {
                  core.info(`PR #${pr.number}: could not resolve thread: ${e.message}`);
                }
              }

              // Check for remaining unresolved threads (human comments only)
              const hasUnresolved = threadData.repository.pullRequest.reviewThreads.nodes
                .some(t => !t.isResolved && (t.comments.nodes.length === 0
                  || !botLogins.has(t.comments.nodes[0].author.login)));

              if (hasUnresolved) {
                core.info(`PR #${pr.number}: has unresolved human review threads, skipping.`);
                continue;
              }

              // All conditions met — enqueue
              try {
                const result = await github.graphql(`
                  mutation($prId:ID!) {
                    enqueuePullRequest(input:{ pullRequestId:$prId }) {
                      mergeQueueEntry { position state }
                    }
                  }
                `, { prId: pr.node_id });
                const entry = result.enqueuePullRequest.mergeQueueEntry;
                core.info(`PR #${pr.number} added to merge queue at position ${entry.position} (${entry.state}).`);
                enqueued++;
              } catch (e) {
                core.info(`Could not enqueue PR #${pr.number} (may already be queued): ${e.message}`);
              }
            }

            core.info(`Sweep complete: ${enqueued} PR(s) enqueued, ${dispatched} Copilot draft(s) dispatched, out of ${prs.length} open.`);
