name: Validate Plugin

on:
  pull_request:
    branches:
      - main
    paths:
      - 'omanfo/**'
      - 'okyeame/**'
      - 'ahuofe/**'
      - 'tests/**'
      - '.github/workflows/validate-plugin.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'omanfo/**'
      - 'okyeame/**'
      - 'ahuofe/**'
      - '.github/workflows/validate-plugin.yml'

jobs:
  validate:
    name: Static Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed plugins
        id: changes
        run: |
          echo "Detecting which plugins have changes..."
          
          # For pull_request events, diff against the base branch
          # For push events, diff against the SHA before the push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "New branch detected, comparing against origin/main"
              git fetch origin main
              CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
            else
              CHANGED_FILES=$(git diff --name-only $BEFORE_SHA...HEAD)
            fi
          fi
          
          # Check if omanfo has changes
          if echo "$CHANGED_FILES" | grep -q "^omanfo/"; then
            echo "omanfo_changed=true" >> $GITHUB_OUTPUT
            echo "✓ omanfo has changes"
          else
            echo "omanfo_changed=false" >> $GITHUB_OUTPUT
            echo "○ omanfo has no changes"
          fi
          
          # Check if okyeame has changes
          if echo "$CHANGED_FILES" | grep -q "^okyeame/"; then
            echo "okyeame_changed=true" >> $GITHUB_OUTPUT
            echo "✓ okyeame has changes"
          else
            echo "okyeame_changed=false" >> $GITHUB_OUTPUT
            echo "○ okyeame has no changes"
          fi
      
      - name: Validate omanfo plugin
        if: steps.changes.outputs.omanfo_changed == 'true'
        shell: pwsh
        run: |
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "       VALIDATING OMANFO PLUGIN" -ForegroundColor Cyan
          Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
          
          $failures = 0
          
          # Test 1: File Structure
          Write-Host "`n▶ Running Test-FileStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-FileStructure.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 3: PowerShell Syntax
          Write-Host "`n▶ Running Test-PowerShellSyntax..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-PowerShellSyntax.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 4: SKILL.md Quality
          Write-Host "`n▶ Running Test-SkillQuality..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-SkillQuality.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 5: Evaluation Coverage
          Write-Host "`n▶ Running Test-EvalCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-EvalCoverage.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 6: Markdown Structure
          Write-Host "`n▶ Running Test-MarkdownStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-MarkdownStructure.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 7: Script Test Coverage
          Write-Host "`n▶ Running Test-ScriptTestCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-ScriptTestCoverage.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Summary
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          if ($failures -eq 0) {
            Write-Host "   ✅ ALL OMANFO VALIDATIONS PASSED" -ForegroundColor Green
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 0
          } else {
            Write-Host "   ❌ $failures VALIDATION(S) FAILED" -ForegroundColor Red
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 1
          }
      
      - name: Validate okyeame plugin
        if: steps.changes.outputs.okyeame_changed == 'true'
        shell: pwsh
        run: |
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "       VALIDATING OKYEAME PLUGIN" -ForegroundColor Cyan
          Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
          
          $failures = 0
          
          # Test 1: File Structure
          Write-Host "`n▶ Running Test-FileStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-FileStructure.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 3: PowerShell Syntax
          Write-Host "`n▶ Running Test-PowerShellSyntax..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-PowerShellSyntax.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 4: SKILL.md Quality
          Write-Host "`n▶ Running Test-SkillQuality..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-SkillQuality.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 5: Evaluation Coverage
          Write-Host "`n▶ Running Test-EvalCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-EvalCoverage.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 6: Markdown Structure
          Write-Host "`n▶ Running Test-MarkdownStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-MarkdownStructure.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 7: Script Test Coverage
          Write-Host "`n▶ Running Test-ScriptTestCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-ScriptTestCoverage.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Summary
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          if ($failures -eq 0) {
            Write-Host "   ✅ ALL OKYEAME VALIDATIONS PASSED" -ForegroundColor Green
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 0
          } else {
            Write-Host "   ❌ $failures VALIDATION(S) FAILED" -ForegroundColor Red
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 1
          }

  unit-tests:
    name: Pester Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run omanfo unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/omanfo/unit'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
