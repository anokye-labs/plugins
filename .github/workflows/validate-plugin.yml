name: Validate Plugin

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:

jobs:
  validate:
    name: Static Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changed plugins
        id: changes
        run: |
          echo "Detecting which plugins have changes..."
          
          # Use github.event.before to capture all commits in multi-commit pushes
          # For new branches (null SHA), compare against origin/main
          BEFORE_SHA="${{ github.event.before }}"
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "New branch or force-push detected, comparing against origin/main"
            git fetch origin main
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only $BEFORE_SHA...HEAD)
          fi
          
          # Check if omanfo has changes
          if echo "$CHANGED_FILES" | grep -q "^omanfo/"; then
            echo "omanfo_changed=true" >> $GITHUB_OUTPUT
            echo "✓ omanfo has changes"
          else
            echo "omanfo_changed=false" >> $GITHUB_OUTPUT
            echo "○ omanfo has no changes"
          fi
          
          # Check if ahuofe has changes
          if echo "$CHANGED_FILES" | grep -q "^ahuofe/"; then
            echo "ahuofe_changed=true" >> $GITHUB_OUTPUT
            echo "✓ ahuofe has changes"
          else
            echo "ahuofe_changed=false" >> $GITHUB_OUTPUT
            echo "○ ahuofe has no changes"
          fi
          
          # Check if okyeame has changes
          if echo "$CHANGED_FILES" | grep -q "^okyeame/"; then
            echo "okyeame_changed=true" >> $GITHUB_OUTPUT
            echo "✓ okyeame has changes"
          else
            echo "okyeame_changed=false" >> $GITHUB_OUTPUT
            echo "○ okyeame has no changes"
          fi
      
      - name: Validate omanfo plugin
        if: steps.changes.outputs.omanfo_changed == 'true'
        shell: pwsh
        run: |
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "       VALIDATING OMANFO PLUGIN" -ForegroundColor Cyan
          Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
          
          $failures = 0
          
          # Test 1: File Structure
          Write-Host "`n▶ Running Test-FileStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-FileStructure.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 3: PowerShell Syntax
          Write-Host "`n▶ Running Test-PowerShellSyntax..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-PowerShellSyntax.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 4: SKILL.md Quality
          Write-Host "`n▶ Running Test-SkillQuality..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-SkillQuality.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 5: Evaluation Coverage
          Write-Host "`n▶ Running Test-EvalCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-EvalCoverage.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 6: Markdown Structure
          Write-Host "`n▶ Running Test-MarkdownStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-MarkdownStructure.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 7: Script Test Coverage
          Write-Host "`n▶ Running Test-ScriptTestCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-ScriptTestCoverage.ps1 -PluginPath omanfo
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Summary
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          if ($failures -eq 0) {
            Write-Host "   ✅ ALL OMANFO VALIDATIONS PASSED" -ForegroundColor Green
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 0
          } else {
            Write-Host "   ❌ $failures VALIDATION(S) FAILED" -ForegroundColor Red
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 1
          }
      
      - name: Validate okyeame plugin
        if: steps.changes.outputs.okyeame_changed == 'true'
        shell: pwsh
        run: |
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "       VALIDATING OKYEAME PLUGIN" -ForegroundColor Cyan
          Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
          
          $failures = 0
          
          # Test 1: File Structure
          Write-Host "`n▶ Running Test-FileStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-FileStructure.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 3: PowerShell Syntax
          Write-Host "`n▶ Running Test-PowerShellSyntax..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-PowerShellSyntax.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 4: SKILL.md Quality
          Write-Host "`n▶ Running Test-SkillQuality..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-SkillQuality.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 5: Evaluation Coverage
          Write-Host "`n▶ Running Test-EvalCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-EvalCoverage.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 6: Markdown Structure
          Write-Host "`n▶ Running Test-MarkdownStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-MarkdownStructure.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 7: Script Test Coverage
          Write-Host "`n▶ Running Test-ScriptTestCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-ScriptTestCoverage.ps1 -PluginPath okyeame
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Summary
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          if ($failures -eq 0) {
            Write-Host "   ✅ ALL OKYEAME VALIDATIONS PASSED" -ForegroundColor Green
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 0
          } else {
            Write-Host "   ❌ $failures VALIDATION(S) FAILED" -ForegroundColor Red
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 1
          }

      - name: Validate ahuofe plugin
        if: steps.changes.outputs.ahuofe_changed == 'true'
        shell: pwsh
        run: |
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "       VALIDATING AHUOFE PLUGIN" -ForegroundColor Cyan
          Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
          
          $failures = 0
          
          # Test 1: File Structure
          Write-Host "`n▶ Running Test-FileStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-FileStructure.ps1 -PluginPath ahuofe
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 3: PowerShell Syntax
          Write-Host "`n▶ Running Test-PowerShellSyntax..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-PowerShellSyntax.ps1 -PluginPath ahuofe
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 4: SKILL.md Quality
          Write-Host "`n▶ Running Test-SkillQuality..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-SkillQuality.ps1 -PluginPath ahuofe
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 5: Evaluation Coverage
          Write-Host "`n▶ Running Test-EvalCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-EvalCoverage.ps1 -PluginPath ahuofe
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 6: Markdown Structure
          Write-Host "`n▶ Running Test-MarkdownStructure..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-MarkdownStructure.ps1 -PluginPath ahuofe
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Test 7: Script Test Coverage
          Write-Host "`n▶ Running Test-ScriptTestCoverage..." -ForegroundColor Blue
          & ./omanfo/scripts/validation/Test-ScriptTestCoverage.ps1 -PluginPath ahuofe
          if ($LASTEXITCODE -ne 0) { $failures++ }
          
          # Summary
          Write-Host "`n═══════════════════════════════════════" -ForegroundColor Cyan
          if ($failures -eq 0) {
            Write-Host "   ✅ ALL AHUOFE VALIDATIONS PASSED" -ForegroundColor Green
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 0
          } else {
            Write-Host "   ❌ $failures VALIDATION(S) FAILED" -ForegroundColor Red
            Write-Host "═══════════════════════════════════════`n" -ForegroundColor Cyan
            exit 1
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

          $findings = @()
          $dirs = @('omanfo', 'okyeame', 'ahuofe')

          foreach ($dir in $dirs) {
            if (Test-Path $dir) {
              Write-Host "Analyzing $dir..." -ForegroundColor Cyan
              $results = Invoke-ScriptAnalyzer -Path $dir -Recurse -ErrorAction SilentlyContinue
              if ($results) {
                $findings += $results
              }
            }
          }

          # Write findings to step summary
          $summary = "## PSScriptAnalyzer Results`n`n"
          if ($findings.Count -eq 0) {
            $summary += "No issues found.`n"
          } else {
            $summary += "| Severity | File | Line | Rule | Message |`n"
            $summary += "|----------|------|------|------|---------|`n"
            foreach ($f in $findings) {
              $file = $f.ScriptName
              $summary += "| $($f.Severity) | $file | $($f.Line) | $($f.RuleName) | $($f.Message) |`n"
            }
            $summary += "`nTotal: $($findings.Count) finding(s)`n"
          }

          $summary >> $env:GITHUB_STEP_SUMMARY

  unit-tests:
    name: Pester Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run omanfo unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path './coverage' -Force | Out-Null
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/omanfo/unit'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./omanfo/skills/okyerema/scripts/[!_]*.ps1')
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = './coverage/omanfo-coverage.xml'
          Invoke-Pester -Configuration $config

      - name: Report code coverage
        if: always()
        shell: pwsh
        run: |
          $coverageFile = './coverage/omanfo-coverage.xml'
          $summary = "## Code Coverage Report`n`n"

          if (Test-Path $coverageFile) {
            [xml]$xml = Get-Content $coverageFile
            $counter = $xml.report.counter | Where-Object { $_.type -eq 'LINE' }
            if ($counter) {
              $missed = [int]$counter.missed
              $covered = [int]$counter.covered
              $total = $missed + $covered
              if ($total -gt 0) {
                $pct = [math]::Round(($covered / $total) * 100, 2)
              } else {
                $pct = 0
              }
              $summary += "| Metric | Value |`n"
              $summary += "|--------|-------|`n"
              $summary += "| Lines Covered | $covered |`n"
              $summary += "| Lines Missed | $missed |`n"
              $summary += "| **Coverage** | **$pct%** |`n"
            } else {
              $summary += "Coverage data found but no LINE counters present.`n"
            }
          } else {
            $summary += "No coverage report generated.`n"
          }

          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Run scripts unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/scripts/unit'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run skill loading smoke tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/omanfo/Skill-Loading.Smoke.Tests.ps1'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Run install plugin smoke tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/omanfo/Install-Plugin.Smoke.Tests.ps1'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection with TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.24
        with:
          extra_args: --only-verified

      - name: PSScriptAnalyzer security rules
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

          $findings = @()
          $dirs = @('omanfo', 'okyeame', 'ahuofe')

          foreach ($dir in $dirs) {
            if (Test-Path $dir) {
              $results = Invoke-ScriptAnalyzer -Path $dir -Recurse -Severity Error -ErrorAction SilentlyContinue
              if ($results) {
                $findings += $results
              }
            }
          }

          if ($findings.Count -gt 0) {
            Write-Host "Found $($findings.Count) Error-severity issue(s):" -ForegroundColor Red
            $findings | Format-Table -Property Severity, ScriptName, Line, RuleName, Message -AutoSize
            exit 1
          } else {
            Write-Host "No Error-severity issues found." -ForegroundColor Green
          }
