name: Copilot PR Checks

# Bridge workflow: runs required checks for Copilot-authored PRs.
# The Copilot coding agent actor triggers action_required on pull_request events,
# so we use workflow_run (which runs in default-branch context) to bypass that gate.

on:
  workflow_run:
    workflows: ["Copilot coding agent"]
    types: [completed]

jobs:
  # ── Gate: only run when Copilot finished on a PR branch ───────────────
  resolve-pr:
    name: Resolve PR
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_node_id: ${{ steps.pr.outputs.node_id }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - name: Find PR for branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const wr = context.payload.workflow_run;
            const branch = wr.head_branch;
            const sha = wr.head_sha;

            // Only care about copilot branches
            if (!branch.startsWith('copilot/')) {
              core.setOutput('skip', 'true');
              core.info(`Skipping non-copilot branch: ${branch}`);
              return;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
              per_page: 1,
            });

            if (prs.length === 0) {
              core.setOutput('skip', 'true');
              core.info(`No open PR for branch ${branch}`);
              return;
            }

            const pr = prs[0];
            core.setOutput('skip', 'false');
            core.setOutput('number', String(pr.number));
            core.setOutput('node_id', pr.node_id);
            core.setOutput('head_sha', sha);
            core.setOutput('head_ref', branch);
            core.info(`Found PR #${pr.number} for branch ${branch} at ${sha}`);

  # ── Required check: Static Validation ─────────────────────────────────
  validate:
    name: Static Validation
    needs: resolve-pr
    if: needs.resolve-pr.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Detect changed plugins
        id: changes
        run: |
          echo "Detecting which plugins have changes..."
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          for plugin in omanfo ahuofe okyeame; do
            if echo "$CHANGED_FILES" | grep -q "^${plugin}/"; then
              echo "${plugin}_changed=true" >> $GITHUB_OUTPUT
              echo "✓ ${plugin} has changes"
            else
              echo "${plugin}_changed=false" >> $GITHUB_OUTPUT
              echo "○ ${plugin} has no changes"
            fi
          done

      - name: Validate omanfo plugin
        if: steps.changes.outputs.omanfo_changed == 'true'
        shell: pwsh
        run: |
          $failures = 0
          foreach ($test in @('Test-FileStructure','Test-PowerShellSyntax','Test-SkillQuality','Test-EvalCoverage','Test-MarkdownStructure','Test-ScriptTestCoverage')) {
            Write-Host "▶ Running $test..." -ForegroundColor Blue
            & ./omanfo/scripts/validation/$test.ps1 -PluginPath omanfo
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -gt 0) { exit 1 }

      - name: Validate ahuofe plugin
        if: steps.changes.outputs.ahuofe_changed == 'true'
        shell: pwsh
        run: |
          $failures = 0
          foreach ($test in @('Test-FileStructure','Test-PowerShellSyntax','Test-SkillQuality','Test-EvalCoverage','Test-MarkdownStructure','Test-ScriptTestCoverage')) {
            Write-Host "▶ Running $test..." -ForegroundColor Blue
            & ./omanfo/scripts/validation/$test.ps1 -PluginPath ahuofe
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -gt 0) { exit 1 }

      - name: Validate okyeame plugin
        if: steps.changes.outputs.okyeame_changed == 'true'
        shell: pwsh
        run: |
          $failures = 0
          foreach ($test in @('Test-FileStructure','Test-PowerShellSyntax','Test-SkillQuality','Test-EvalCoverage','Test-MarkdownStructure','Test-ScriptTestCoverage')) {
            Write-Host "▶ Running $test..." -ForegroundColor Blue
            & ./omanfo/scripts/validation/$test.ps1 -PluginPath okyeame
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -gt 0) { exit 1 }

  # ── Required check: Check Linked Issue ────────────────────────────────
  check-linked-issue:
    name: Check Linked Issue
    needs: resolve-pr
    if: needs.resolve-pr.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.resolve-pr.outputs.pr_number }}', 10);

            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: prNumber,
            });

            const count = result.repository.pullRequest.closingIssuesReferences.totalCount;

            if (count === 0) {
              core.setFailed(
                `PR #${prNumber} must be linked to a GitHub issue.\n` +
                'Add "Closes #N" to the PR description.'
              );
            } else {
              core.info(`PR #${prNumber} has ${count} linked issue(s).`);
            }

  # ── Pester unit tests ─────────────────────────────────────────────────
  unit-tests:
    name: Pester Unit Tests
    needs: resolve-pr
    if: needs.resolve-pr.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr.outputs.head_sha }}

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run omanfo unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/omanfo/unit'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  # ── Auto-approve + enqueue ────────────────────────────────────────────
  auto-approve:
    name: Auto Approve (Copilot)
    needs: [resolve-pr, validate, check-linked-issue]
    if: needs.resolve-pr.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Approve and enqueue
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.resolve-pr.outputs.pr_number }}', 10);
            const prNodeId = '${{ needs.resolve-pr.outputs.pr_node_id }}';

            // Skip if PR is still a draft
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.draft) {
              core.info(`PR #${prNumber} is still a draft, skipping approve.`);
              return;
            }

            // Approve if not already approved
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (!reviews.some(r => r.state === 'APPROVED')) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
              });
              core.info(`Approved PR #${prNumber}`);
            }

            // Enable auto-merge
            try {
              await github.graphql(`
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: MERGE }) {
                    pullRequest { number }
                  }
                }
              `, { id: prNodeId });
              core.info(`Enabled auto-merge on PR #${prNumber}`);
            } catch (e) {
              core.info(`Auto-merge: ${e.message}`);
            }

            // Check for unresolved threads before enqueue
            const threads = await github.graphql(`
              query($owner:String!,$repo:String!,$pr:Int!) {
                repository(owner:$owner,name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:100) { nodes { isResolved } }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo, pr: prNumber });

            if (threads.repository.pullRequest.reviewThreads.nodes.some(t => !t.isResolved)) {
              core.info('Unresolved review threads — skipping enqueue.');
              return;
            }

            // Enqueue
            try {
              await github.graphql(`
                mutation($id:ID!) {
                  enqueuePullRequest(input:{pullRequestId:$id}) {
                    mergeQueueEntry { position state }
                  }
                }
              `, { id: prNodeId });
              core.info(`Enqueued PR #${prNumber}`);
            } catch (e) {
              core.info(`Enqueue: ${e.message}`);
            }
