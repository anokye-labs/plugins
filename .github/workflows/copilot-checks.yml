name: Copilot PR Checks

# Bridge workflow: runs required checks for Copilot-authored PRs.
# Two trigger paths:
# 1. pull_request_target — fires when a trusted actor (human/bot) triggers a PR event
# 2. workflow_dispatch — fired by auto-enqueue.yml for Copilot draft PRs that are stuck
#    in action_required. GITHUB_TOKEN can trigger workflow_dispatch (Sept 2022 exception).

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, dequeued]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process (used by auto-enqueue scheduled sweep)'
        required: true
        type: number

jobs:
  # ── Gate: only run for Copilot PRs ────────────────────────────────────
  resolve-pr:
    name: Resolve PR
    runs-on: ubuntu-latest
    # For pull_request_target: gate on branch prefix AND actor identity.
    # For workflow_dispatch: always run (auto-enqueue already verified eligibility).
    if: >
      github.event_name == 'workflow_dispatch'
      || (startsWith(github.head_ref, 'copilot/')
          && contains(fromJSON('["Copilot","copilot-swe-agent[bot]"]'), github.event.pull_request.user.login))
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_node_id: ${{ steps.pr.outputs.node_id }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      skip: ${{ steps.pr.outputs.skip }}
      is_dequeue: ${{ steps.pr.outputs.is_dequeue }}
    steps:
      - name: Set PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const prNumber = parseInt('${{ inputs.pr_number }}', 10);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              // Verify this is a Copilot PR on a copilot/* branch
              if (!pr.head.ref.startsWith('copilot/') ||
                  !['Copilot', 'copilot-swe-agent[bot]'].includes(pr.user.login)) {
                core.setOutput('skip', 'true');
                core.info(`PR #${prNumber} is not a Copilot PR, skipping.`);
                return;
              }

              core.setOutput('number', String(pr.number));
              core.setOutput('node_id', pr.node_id);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('skip', 'false');
              core.setOutput('is_dequeue', 'false');
              core.info(`[dispatch] PR #${pr.number} from ${pr.head.ref} by ${pr.user.login}`);
            } else {
              // pull_request_target path
              const isDequeue = context.payload.action === 'dequeued';
              core.setOutput('number', String(context.payload.pull_request.number));
              core.setOutput('node_id', context.payload.pull_request.node_id);
              core.setOutput('head_sha', context.payload.pull_request.head.sha);
              core.setOutput('head_ref', context.payload.pull_request.head.ref);
              core.setOutput('skip', 'false');
              core.setOutput('is_dequeue', isDequeue ? 'true' : 'false');
              core.info(`[event] PR #${context.payload.pull_request.number} from ${context.payload.pull_request.head.ref} by ${context.payload.pull_request.user.login}`);
            }

  # ── Required check: Static Validation ─────────────────────────────────
  validate:
    name: Static Validation
    needs: resolve-pr
    if: needs.resolve-pr.outputs.skip != 'true' && needs.resolve-pr.outputs.is_dequeue != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Detect changed plugins
        id: changes
        run: |
          echo "Detecting which plugins have changes..."
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          for plugin in omanfo ahuofe okyeame; do
            if echo "$CHANGED_FILES" | grep -q "^${plugin}/"; then
              echo "${plugin}_changed=true" >> $GITHUB_OUTPUT
              echo "✓ ${plugin} has changes"
            else
              echo "${plugin}_changed=false" >> $GITHUB_OUTPUT
              echo "○ ${plugin} has no changes"
            fi
          done

      - name: Validate omanfo plugin
        if: steps.changes.outputs.omanfo_changed == 'true'
        shell: pwsh
        run: |
          $failures = 0
          foreach ($test in @('Test-FileStructure','Test-PowerShellSyntax','Test-SkillQuality','Test-EvalCoverage','Test-MarkdownStructure','Test-ScriptTestCoverage')) {
            Write-Host "▶ Running $test..." -ForegroundColor Blue
            & ./omanfo/scripts/validation/$test.ps1 -PluginPath omanfo
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -gt 0) { exit 1 }

      - name: Validate ahuofe plugin
        if: steps.changes.outputs.ahuofe_changed == 'true'
        shell: pwsh
        run: |
          $failures = 0
          foreach ($test in @('Test-FileStructure','Test-PowerShellSyntax','Test-SkillQuality','Test-EvalCoverage','Test-MarkdownStructure','Test-ScriptTestCoverage')) {
            Write-Host "▶ Running $test..." -ForegroundColor Blue
            & ./omanfo/scripts/validation/$test.ps1 -PluginPath ahuofe
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -gt 0) { exit 1 }

      - name: Validate okyeame plugin
        if: steps.changes.outputs.okyeame_changed == 'true'
        shell: pwsh
        run: |
          $failures = 0
          foreach ($test in @('Test-FileStructure','Test-PowerShellSyntax','Test-SkillQuality','Test-EvalCoverage','Test-MarkdownStructure','Test-ScriptTestCoverage')) {
            Write-Host "▶ Running $test..." -ForegroundColor Blue
            & ./omanfo/scripts/validation/$test.ps1 -PluginPath okyeame
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          if ($failures -gt 0) { exit 1 }

  # ── Required check: Check Linked Issue ────────────────────────────────
  check-linked-issue:
    name: Check Linked Issue
    needs: resolve-pr
    if: needs.resolve-pr.outputs.skip != 'true' && needs.resolve-pr.outputs.is_dequeue != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.resolve-pr.outputs.pr_number }}', 10);

            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: prNumber,
            });

            const count = result.repository.pullRequest.closingIssuesReferences.totalCount;

            if (count === 0) {
              core.setFailed(
                `PR #${prNumber} must be linked to a GitHub issue.\n` +
                'Add "Closes #N" to the PR description.'
              );
            } else {
              core.info(`PR #${prNumber} has ${count} linked issue(s).`);
            }

  # ── Pester unit tests ─────────────────────────────────────────────────
  unit-tests:
    name: Pester Unit Tests
    needs: resolve-pr
    if: needs.resolve-pr.outputs.skip != 'true' && needs.resolve-pr.outputs.is_dequeue != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-pr.outputs.head_sha }}

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force

      - name: Run omanfo unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/omanfo/unit'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Run scripts unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/scripts/unit'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
  # NOTE: This job deliberately does NOT checkout PR code. It only uses
  # GitHub API calls (which run base-branch code from actions/github-script)
  # so write permissions here are safe.
  auto-approve:
    name: Auto Approve (Copilot)
    needs: [resolve-pr, validate, check-linked-issue]
    if: needs.resolve-pr.outputs.skip != 'true' && needs.resolve-pr.outputs.is_dequeue != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      checks: write
    steps:
      - name: Approve and enqueue
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.resolve-pr.outputs.pr_number }}', 10);
            const prNodeId = '${{ needs.resolve-pr.outputs.pr_node_id }}';

            // Merge main into PR branch so it's up-to-date before merging.
            try {
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              core.info(`Merged main into PR #${prNumber} branch.`);
              await new Promise(r => setTimeout(r, 5000));
            } catch (e) {
              core.info(`Branch update (may already be up-to-date): ${e.message}`);
            }

            // Re-fetch PR to get current HEAD SHA (may have changed after updateBranch)
            const { data: prFresh } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = prFresh.head.sha;

            // Report required status checks on PR HEAD SHA.
            // workflow_dispatch check runs are tied to main's SHA, not the PR's.
            // Use the Checks API to create them on the correct SHA.
            if (context.eventName === 'workflow_dispatch') {
              for (const checkName of ['Static Validation', 'Check Linked Issue']) {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: headSha,
                  name: checkName,
                  status: 'completed',
                  conclusion: 'success',
                  output: {
                    title: `${checkName} passed`,
                    summary: `Validated by copilot-checks.yml for PR #${prNumber}`,
                  },
                });
                core.info(`Created '${checkName}' check on ${headSha.slice(0, 7)}`);
              }
            }

            // Mark draft PRs ready for review — Copilot creates PRs as drafts,
            // and the require-linked-issue workflow may not have run due to approval gates.
            if (prFresh.draft) {
              core.info(`PR #${prNumber} is a draft — marking ready for review.`);
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                      pullRequest { number isDraft }
                    }
                  }
                `, { id: prNodeId });
                core.info(`PR #${prNumber} marked ready for review.`);
              } catch (e) {
                core.info(`Could not mark ready: ${e.message}`);
                return;
              }
            }

            // Approve if not already approved
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (!reviews.some(r => r.state === 'APPROVED')) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
              });
              core.info(`Approved PR #${prNumber}`);
            }

            // Enable auto-merge
            try {
              await github.graphql(`
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: MERGE }) {
                    pullRequest { number }
                  }
                }
              `, { id: prNodeId });
              core.info(`Enabled auto-merge on PR #${prNumber}`);
            } catch (e) {
              core.info(`Auto-merge: ${e.message}`);
            }

            // Auto-resolve bot review threads — automated review bots (code-quality,
            // Devin review) leave informational comments that create unresolved threads,
            // blocking the merge queue. Resolve them so auto-enqueue can proceed.
            // GraphQL author.login omits the [bot] suffix shown in the UI.
            // Keep both forms so the match works regardless of API surface.
            const botLogins = new Set([
              'github-code-quality[bot]',  'github-code-quality',
              'devin-ai-integration[bot]', 'devin-ai-integration',
              'github-advanced-security[bot]', 'github-advanced-security',
            ]);

            const threadData = await github.graphql(`
              query($owner:String!,$repo:String!,$pr:Int!) {
                repository(owner:$owner,name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:100) {
                      nodes {
                        id
                        isResolved
                        comments(first:1) {
                          nodes { author { login } }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo, pr: prNumber });

            const unresolvedBotThreads = threadData.repository.pullRequest.reviewThreads.nodes
              .filter(t => !t.isResolved && t.comments.nodes.length > 0
                && botLogins.has(t.comments.nodes[0].author.login));

            for (const thread of unresolvedBotThreads) {
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    resolveReviewThread(input: { threadId: $id }) {
                      thread { isResolved }
                    }
                  }
                `, { id: thread.id });
                core.info(`Resolved bot thread ${thread.id} (by ${thread.comments.nodes[0].author.login})`);
              } catch (e) {
                core.info(`Could not resolve thread ${thread.id}: ${e.message}`);
              }
            }

            if (unresolvedBotThreads.length > 0) {
              core.info(`Resolved ${unresolvedBotThreads.length} bot review thread(s).`);
            }

            // Re-check for remaining unresolved threads (human comments)
            const remainingThreads = await github.graphql(`
              query($owner:String!,$repo:String!,$pr:Int!) {
                repository(owner:$owner,name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:100) { nodes { isResolved } }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo, pr: prNumber });

            if (remainingThreads.repository.pullRequest.reviewThreads.nodes.some(t => !t.isResolved)) {
              core.info('Unresolved human review threads — skipping enqueue.');
              return;
            }

            // Enqueue
            try {
              await github.graphql(`
                mutation($id:ID!) {
                  enqueuePullRequest(input:{pullRequestId:$id}) {
                    mergeQueueEntry { position state }
                  }
                }
              `, { id: prNodeId });
              core.info(`Enqueued PR #${prNumber}`);
            } catch (e) {
              core.info(`Enqueue: ${e.message}`);
            }

  # ── Dequeue handler: Conflict Recovery ────────────────────────────────
  handle-dequeue:
    name: Handle Dequeue (Conflict Recovery)
    needs: resolve-pr
    if: needs.resolve-pr.outputs.skip != 'true' && needs.resolve-pr.outputs.is_dequeue == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post conflict-recovery comment or add needs-human label
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ needs.resolve-pr.outputs.pr_number }}', 10);
            const MAX_RETRIES = 3;
            const RETRY_MARKER = '<!-- copilot-conflict-retry -->';

            // Count existing retry attempts by scanning PR comments for the marker.
            // Paginate to handle PRs with many comments.
            let retryCount = 0;
            let page = 1;
            while (true) {
              const { data: batch } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
                page,
              });
              retryCount += batch.filter(c => c.body.includes(RETRY_MARKER)).length;
              if (batch.length < 100) break;
              page++;
            }

            if (retryCount >= MAX_RETRIES) {
              // Ensure the needs-human label exists, then apply it
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-human',
                });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-human',
                  color: 'e11d48',
                  description: 'Requires human intervention after automated recovery failed',
                });
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['needs-human'],
              });
              core.info(`PR #${prNumber} reached max retries (${MAX_RETRIES}). Added 'needs-human' label.`);
              return;
            }

            // Gather context: files changed in the PR (first 100 — sufficient for typical Copilot PRs)
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const changedFiles = files.map(f => `- \`${f.filename}\``).join('\n');

            // Gather context: 10 most recent commits on main (enough to identify likely conflict sources)
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: 'main',
              per_page: 10,
            });
            const recentCommits = commits
              .map(c => `- \`${c.sha.slice(0, 7)}\` ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            const attempt = retryCount + 1;
            const body = [
              RETRY_MARKER,
              `## 🔄 Merge Queue Conflict Recovery (Attempt ${attempt}/${MAX_RETRIES})`,
              '',
              'This PR was ejected from the merge queue due to a merge conflict.',
              '',
              '**Files changed in this PR:**',
              changedFiles,
              '',
              '**Recent commits to `main` (potential conflict sources):**',
              recentCommits,
              '',
              `@copilot Please rebase this branch against the latest \`main\`, resolving any conflicts in the files listed above, then push the updated branch.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.info(`Posted conflict-recovery comment (attempt ${attempt}/${MAX_RETRIES}) on PR #${prNumber}`);
