name: Auto Approve

on:
  pull_request:
    branches: [main]

jobs:
  auto-approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Auto approve for trusted authors
        uses: actions/github-script@v7
        with:
          script: |
            const trustedActors = [
              'hoopsomuah',
              'dependabot[bot]',
              'renovate[bot]',
              'devin-ai-integration[bot]',
              'claude[bot]',
              'chatgpt-codex-connector[bot]',
            ];

            const actor = context.payload.pull_request.user.login;

            if (!trustedActors.includes(actor)) {
              core.info(`Skipping auto-approve for untrusted actor: ${actor}`);
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const alreadyApproved = reviews.some(r => r.state === 'APPROVED');
            if (!alreadyApproved) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                event: 'APPROVE',
              });
              core.info(`Auto-approved PR #${context.payload.pull_request.number} for trusted actor: ${actor}`);
            } else {
              core.info('PR already has an approval, skipping.');
            }

            // Enable auto-merge so PR enters the merge queue once requirements are satisfied
            try {
              await github.rest.pulls.updateBranch({});
            } catch (_) {}
            await github.graphql(`
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: MERGE }) {
                  pullRequest { number autoMergeRequest { mergeMethod } }
                }
              }
            `, { pullRequestId: context.payload.pull_request.node_id });
            core.info(`Enabled auto-merge on PR #${context.payload.pull_request.number}`);

