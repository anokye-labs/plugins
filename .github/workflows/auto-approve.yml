name: Auto Approve

on:
  pull_request:
    branches: [main]

jobs:
  auto-approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto approve for trusted authors
        uses: actions/github-script@v7
        with:
          script: |
            const trustedActors = [
              'hoopsomuah',
              'dependabot[bot]',
              'renovate[bot]',
              'devin-ai-integration[bot]',
              'claude[bot]',
              'chatgpt-codex-connector[bot]',
              'copilot-swe-agent[bot]',
              'app/copilot-swe-agent',
            ];

            const actor = context.payload.pull_request.user.login;

            if (!trustedActors.includes(actor)) {
              core.info(`Skipping auto-approve for untrusted actor: ${actor}`);
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const prNodeId = context.payload.pull_request.node_id;
            const headSha  = context.payload.pull_request.head.sha;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const alreadyApproved = reviews.some(r => r.state === 'APPROVED');
            if (!alreadyApproved) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
              });
              core.info(`Auto-approved PR #${prNumber} for trusted actor: ${actor}`);
            } else {
              core.info('PR already has an approval, skipping.');
            }

            // Enable auto-merge so PR enters the merge queue once requirements are satisfied
            try {
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: MERGE }) {
                    pullRequest { number autoMergeRequest { mergeMethod } }
                  }
                }
              `, { pullRequestId: prNodeId });
              core.info(`Enabled auto-merge on PR #${prNumber}`);
            } catch (e) {
              core.info(`auto-merge already enabled or not applicable: ${e.message}`);
            }

            // Enqueue immediately if all required checks already passed.
            // GitHub does not re-evaluate auto-enqueue when auto-merge is enabled
            // after checks have already completed, so we handle it explicitly.
            const requiredChecks = ['Static Validation', 'Check Linked Issue'];
            const { data: checkData } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              per_page: 100,
            });
            const allPassed = requiredChecks.every(name =>
              checkData.check_runs.some(r => r.name === name && r.conclusion === 'success')
            );
            if (!allPassed) {
              core.info('Not all required checks have passed yet; auto-enqueue.yml will handle enqueueing.');
              return;
            }

            const threads = await github.graphql(`
              query($owner:String!,$repo:String!,$pr:Int!) {
                repository(owner:$owner,name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:20) { nodes { isResolved } }
                  }
                }
              }
            `, { owner: context.repo.owner, repo: context.repo.repo, pr: prNumber });

            const hasUnresolved = threads.repository.pullRequest.reviewThreads.nodes.some(t => !t.isResolved);
            if (hasUnresolved) {
              core.info('PR has unresolved review threads; skipping enqueue.');
              return;
            }

            try {
              await github.graphql(`
                mutation($prId:ID!) {
                  enqueuePullRequest(input:{ pullRequestId:$prId }) {
                    mergeQueueEntry { position state }
                  }
                }
              `, { prId: prNodeId });
              core.info(`PR #${prNumber} added to merge queue.`);
            } catch (e) {
              core.info(`Could not enqueue (may already be queued): ${e.message}`);
            }

