name: Post-Merge Lifecycle

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  post-merge:
    name: Post-Merge Lifecycle
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Update linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prUrl = context.payload.pull_request.html_url;
            const mergedBy = context.payload.pull_request.merged_by?.login || 'unknown';

            core.info(`PR #${prNumber} merged by ${mergedBy}`);

            // Query linked (closing) issues via GraphQL
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                        title
                        state
                        id
                      }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: prNumber,
            });

            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;

            if (linkedIssues.length === 0) {
              core.info('No linked issues found.');
              return;
            }

            for (const issue of linkedIssues) {
              core.info(`Processing linked issue #${issue.number}: ${issue.title}`);

              // Post completion comment on the issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  `## Completed via PR #${prNumber}`,
                  '',
                  `**PR:** ${prUrl}`,
                  `**Title:** ${prTitle}`,
                  `**Merged by:** @${mergedBy}`,
                  '',
                  'This issue has been resolved and the changes are now on `main`.',
                ].join('\n'),
              });
              core.info(`Posted completion comment on issue #${issue.number}`);

              // Check if the issue has a parent and whether all sibling sub-issues are closed
              try {
                const parentResult = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $number) {
                        parent {
                          number
                          title
                          state
                          subIssues(first: 100) {
                            nodes {
                              number
                              state
                            }
                          }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: issue.number,
                });

                const parent = parentResult.repository.issue.parent;
                if (!parent) {
                  core.info(`Issue #${issue.number} has no parent issue.`);
                  continue;
                }

                core.info(`Issue #${issue.number} has parent #${parent.number}: ${parent.title}`);

                if (parent.state === 'CLOSED') {
                  core.info(`Parent #${parent.number} is already closed.`);
                  continue;
                }

                // Check if all sub-issues are closed (including the one we just closed)
                const allSubIssues = parent.subIssues.nodes;
                const openSubIssues = allSubIssues.filter(s =>
                  s.state === 'OPEN' && s.number !== issue.number
                );

                if (openSubIssues.length === 0) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parent.number,
                    body: [
                      `## All sub-issues completed`,
                      '',
                      `All ${allSubIssues.length} sub-issue(s) under this issue are now closed.`,
                      `Last completed: #${issue.number} via PR #${prNumber}.`,
                      '',
                      'This issue may be ready for closure.',
                    ].join('\n'),
                  });
                  core.info(`All sub-issues of parent #${parent.number} are closed — posted notification.`);
                } else {
                  core.info(`Parent #${parent.number} still has ${openSubIssues.length} open sub-issue(s): ${openSubIssues.map(s => '#' + s.number).join(', ')}`);
                }
              } catch (e) {
                // sub_issues feature may not be available — log and continue
                core.info(`Could not check parent issue: ${e.message}`);
              }
            }
