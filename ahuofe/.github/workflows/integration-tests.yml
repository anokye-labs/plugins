name: Integration Tests

on:
  push:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests
        shell: pwsh
        working-directory: ahuofe
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          Invoke-Pester -Path './tests/integration' -Output Detailed -CI
