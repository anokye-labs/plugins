name: Task
description: A concrete, actionable work item for the Ahuofe plugin.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for concrete, actionable work items.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know this task is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any extra context, links, or references.
