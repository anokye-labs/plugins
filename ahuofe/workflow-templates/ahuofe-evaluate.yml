# plugins/ahuofe/workflow-templates/ahuofe-evaluate.yml
#
# Reusable drift evaluation workflow (stub).
# Runs evaluate-drift on a specified entity and posts
# the drift score as a PR comment.
# Trigger pattern: @ahuofe evaluate <entity>

name: Ahuofe Evaluate Drift

on:
  workflow_call:
    inputs:
      config_path:
        required: true
        type: string
        description: "Path to .ahuofe.yaml in the calling repo"
      entity:
        required: true
        type: string
        description: "Entity name to evaluate (e.g., okyeame)"
      pr_number:
        required: true
        type: string
        description: "PR number to post drift results to"
      brand_path:
        required: false
        type: string
        default: "./brand"
        description: "Path to brand/ directory in the calling repo"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
    outputs:
      drift_score:
        description: "Drift score for the evaluated entity (0-100)"
        value: ${{ jobs.evaluate.outputs.drift_score }}

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      drift_score: ${{ steps.evaluate-drift.outputs.drift_score }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || '' }}

      # Check out the plugin repo for pipeline code
      - uses: actions/checkout@v4
        with:
          repository: anokye-labs/plugins
          path: _ahuofe_plugin
          sparse-checkout: ahuofe/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pipeline
        run: cd _ahuofe_plugin/ahuofe/pipeline && npm ci

      - name: Evaluate drift
        id: evaluate-drift
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx _ahuofe_plugin/ahuofe/pipeline/src/stages/evaluate-drift.ts \
            --config ${{ inputs.config_path }} \
            --entity ${{ inputs.entity }} \
            --brand ${{ inputs.brand_path }} \
            --generations ./generations \
            --output ./drift-report.json

          SCORE=$(jq -r '.score' drift-report.json)
          echo "drift_score=$SCORE" >> "$GITHUB_OUTPUT"

      - name: Post drift score to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCORE="${{ steps.evaluate-drift.outputs.drift_score }}"
          ENTITY="${{ inputs.entity }}"
          BODY="## Drift Evaluation: ${ENTITY}\n\n"
          BODY+="**Score:** ${SCORE}/100\n\n"

          if [ "$(echo "$SCORE < 70" | bc -l)" -eq 1 ]; then
            BODY+="> Warning: Drift score is below threshold (70). Consider re-generating.\n"
          else
            BODY+="Drift score is within acceptable range.\n"
          fi

          BODY+="\n---\n_Generated by ahuofe evaluate-drift_"

          gh pr comment "${{ inputs.pr_number }}" --body "$(echo -e "$BODY")"
